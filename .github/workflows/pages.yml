name: Validate and deploy MATRIZ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: matriz-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate routes, brand, original logo, SEO, CSP, credentials and contact
        run: npm test
      - name: Build public files only
        run: npm run build
      - name: Audit the actual publication output
        run: python3 tests/audit.py --dist
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload validated site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
